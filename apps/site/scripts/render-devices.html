<!-- 첫 화면 기기 렌더러. 쓰는 법은 render-devices.mjs 맨 위. 화면을 검은 유리로 바꿔 찍고, 화면 네 모서리의 이미지 좌표를 같이 저장한다. -->
<!doctype html><meta charset="utf-8">
<style>body{margin:0;background:#e7e5e4;font:12px system-ui} .row{display:flex;gap:12px;padding:12px;align-items:flex-start} img,canvas{max-width:48vw;background:repeating-conic-gradient(#d6d3d1 0 25%,#f5f5f4 0 50%) 0 0/16px 16px}</style>
<div class="row" id="out"></div>
<script type="importmap">{"imports":{"three":"/three/build/three.module.js","three/addons/":"/three/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const loader = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);

// 화면 판의 네 모서리 (판 위 좌표로 잰 바운딩 사각형). 둥근 모서리 바깥까지 감싼다.
function screenCorners(mesh) {
  mesh.updateMatrixWorld(true);
  const pos = mesh.geometry.attributes.position;
  const pts = [];
  const v = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) pts.push(v.fromBufferAttribute(pos, i).applyMatrix4(mesh.matrixWorld).clone());
  const c = pts.reduce((a, p) => a.add(p), new THREE.Vector3()).multiplyScalar(1 / pts.length);
  // 판의 법선: 공분산이 가장 작은 방향 (거듭제곱법 대신 세 점 외적 평균으로 근사)
  const n = new THREE.Vector3();
  for (let i = 0; i + 2 < pts.length; i += 3) {
    const a = pts[i].clone().sub(pts[i + 1]), b = pts[i + 2].clone().sub(pts[i + 1]);
    const cr = a.cross(b);
    if (cr.lengthSq() > 1e-14) { if (n.lengthSq() && cr.dot(n) < 0) cr.negate(); n.add(cr.normalize()); }
  }
  n.normalize();
  const X = new THREE.Vector3(1, 0, 0).sub(n.clone().multiplyScalar(n.x)).normalize();
  const U = n.clone().cross(X).normalize(); // 판 위쪽
  if (U.y < 0) U.negate();
  let u0 = Infinity, u1 = -Infinity, v0 = Infinity, v1 = -Infinity;
  for (const p of pts) {
    const d = p.clone().sub(c);
    const x = d.dot(X), y = d.dot(U);
    u0 = Math.min(u0, x); u1 = Math.max(u1, x); v0 = Math.min(v0, y); v1 = Math.max(v1, y);
  }
  const at = (x, y) => c.clone().add(X.clone().multiplyScalar(x)).add(U.clone().multiplyScalar(y));
  return { tl: at(u0, v1), tr: at(u1, v1), br: at(u1, v0), bl: at(u0, v0), size: [u1 - u0, v1 - v0] };
}

async function render(cfg) {
  const W = cfg.width, H = cfg.height;
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1);
  renderer.setSize(W, H);
  renderer.setClearColor(0x000000, 0);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.NeutralToneMapping;
  renderer.toneMappingExposure = cfg.exposure ?? 1;
  const scene = new THREE.Scene();
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.03).texture;
  scene.environmentIntensity = cfg.env ?? 1;
  const key = new THREE.DirectionalLight(0xffffff, cfg.key ?? 1.4);
  key.position.set(-2, 4, 5);
  scene.add(key);
  const rim = new THREE.DirectionalLight(0xffffff, cfg.rim ?? 0.8);
  rim.position.set(4, 2, -3);
  scene.add(rim);

  const g = await loader.loadAsync(`/models/${cfg.file}.glb`);
  const root = new THREE.Group();
  root.add(g.scene);
  root.rotation.set(...cfg.rotation);
  scene.add(root);
  root.updateMatrixWorld(true);

  let screen = null;
  g.scene.traverse((o) => { if (o.isMesh && o.name === cfg.screen) screen = o; });
  // 화면은 꺼진 검은 유리로 (위에 진짜 데모를 얹는다)
  screen.material = new THREE.MeshPhysicalMaterial({ color: 0x050505, roughness: 0.12, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.05 });

  const box = new THREE.Box3().setFromObject(root);
  const center = box.getCenter(new THREE.Vector3());
  const camera = new THREE.PerspectiveCamera(cfg.fov, W / H, 0.01, 50);
  const dir = new THREE.Vector3(...cfg.view).normalize();
  // 물체가 화면에 꽉 차게: 바운딩 구 반지름으로 거리 계산
  const radius = box.getBoundingSphere(new THREE.Sphere()).radius;
  const dist = radius / Math.sin(THREE.MathUtils.degToRad(cfg.fov / 2)) * (cfg.fill ?? 1);
  camera.position.copy(center).add(dir.multiplyScalar(dist));
  camera.lookAt(center);
  camera.updateMatrixWorld(true);
  renderer.render(scene, camera);

  // 화면 모서리: 돌리기 전(모델 좌표)에서 재야 화면의 가로가 X 축과 맞는다. 잰 뒤 돌린 만큼 옮긴다.
  const rot = root.rotation.clone();
  root.rotation.set(0, 0, 0);
  root.updateMatrixWorld(true);
  const k = screenCorners(screen);
  root.rotation.copy(rot);
  root.updateMatrixWorld(true);
  for (const n of ['tl', 'tr', 'br', 'bl']) k[n].applyMatrix4(root.matrixWorld);
  const proj = (p) => { const q = p.clone().project(camera); return [((q.x + 1) / 2) * W, ((1 - q.y) / 2) * H]; };
  let quad = { tl: proj(k.tl), tr: proj(k.tr), br: proj(k.br), bl: proj(k.bl) };
  // 모델에 따라 화면이 -Z 를 보고 있으면 좌우가 뒤집혀 나온다. 찍힌 위치로 바로잡는다.
  if (quad.tl[0] > quad.tr[0]) quad = { tl: quad.tr, tr: quad.tl, br: quad.bl, bl: quad.br };

  // 투명한 가장자리 잘라내기 (여백 조금 남김)
  const c2 = document.createElement('canvas');
  c2.width = W; c2.height = H;
  const ctx = c2.getContext('2d');
  ctx.drawImage(renderer.domElement, 0, 0);
  const data = ctx.getImageData(0, 0, W, H).data;
  let x0 = W, y0 = H, x1 = 0, y1 = 0;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (data[(y * W + x) * 4 + 3] > 8) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  const pad = Math.round(Math.max(x1 - x0, y1 - y0) * 0.02);
  x0 = Math.max(0, x0 - pad); y0 = Math.max(0, y0 - pad); x1 = Math.min(W - 1, x1 + pad); y1 = Math.min(H - 1, y1 + pad);
  const cw = x1 - x0 + 1, ch = y1 - y0 + 1;
  const crop = document.createElement('canvas');
  crop.width = cw; crop.height = ch;
  crop.getContext('2d').drawImage(c2, x0, y0, cw, ch, 0, 0, cw, ch);
  for (const key2 of Object.keys(quad)) quad[key2] = [(quad[key2][0] - x0) / cw, (quad[key2][1] - y0) / ch];

  // 확인용: 모서리에 빨간 점
  const dbg = document.createElement('canvas');
  dbg.width = cw; dbg.height = ch;
  const d = dbg.getContext('2d');
  d.drawImage(crop, 0, 0);
  d.strokeStyle = '#ff3b30'; d.lineWidth = Math.max(2, cw / 400);
  d.beginPath();
  ['tl', 'tr', 'br', 'bl'].forEach((n, i) => { const [x, y] = quad[n]; i ? d.lineTo(x * cw, y * ch) : d.moveTo(x * cw, y * ch); });
  d.closePath(); d.stroke();
  document.getElementById('out').appendChild(dbg);

  const meta = { width: cw, height: ch, quad, screenMeters: k.size };
  window.results = window.results || {};
  window.results[cfg.name] = meta;
  if (cfg.save) {
    await fetch(`/save?name=${cfg.name}.png`, { method: 'POST', body: crop.toDataURL('image/png') });
    await fetch(`/save?name=${cfg.name}.json`, { method: 'POST', body: JSON.stringify(meta, null, 2) });
  }
  renderer.dispose();
  return meta;
}

const params = new URLSearchParams(location.search);
const save = params.has('save');
const scale = Number(params.get('scale') || 1);
window.configs = {
  macbook: { name: 'macbook', file: 'macbook_pro_14_inch_m5_black', screen: 'Object_107', rotation: [0, -0.24, 0], view: [0, 0.3, 1], fov: 22, width: 2600 * scale, height: 2000 * scale, fill: 0.98, exposure: 1.05, env: 1, key: 1.3, rim: 0.7, save },
  iphone: { name: 'iphone', file: 'apple_iphone_15_pro_max_black', screen: 'xXDHkMplTIDAXLN', rotation: [-0.05, Math.PI + 0.32, 0.03], view: [0, 0.08, 1], fov: 22, width: 1400 * scale, height: 2200 * scale, fill: 0.98, exposure: 1.05, env: 1, key: 1.3, rim: 0.9, save },
};
for (const k of (params.get('only') || 'macbook,iphone').split(',')) await render(window.configs[k]);
document.title = 'done';
</script>
